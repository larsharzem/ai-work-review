name: Release

# BRAT installs from releases/latest/download/, so a release without main.js +
# manifest.json + styles.css as assets is useless. This builds them and attaches
# them, instead of relying on someone dragging three files into the web form.
#
# Runs on a pushed version tag, or manually for a tag that already exists
# (Actions → Release → Run workflow → enter the tag).

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach (e.g. 0.9.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      # The suite builds its own fixture vault, so it runs anywhere
      - run: npm test

      - run: npm run build:only

      - name: Tag must match manifest.json
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match manifest version $version" >&2
            exit 1
          fi

      - name: Create or update the release and attach the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" main.js manifest.json styles.css --clobber
